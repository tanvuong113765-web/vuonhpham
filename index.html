<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUFF TIM VUONGPHAM</title>
    <!-- Thư viện EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("Rb_eZ3naLeY45yFWu");
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            min-height: 500px;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px 20px;
        }
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ccc;
        }
        input[type="text"] {
            width: 90%;
            padding: 15px;
            font-size: 16px;
            background-color: #333;
            border: 2px solid #666;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }
        input::placeholder {
            color: #aaa;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            width: 90%;
            justify-content: center;
        }
        .btn {
            flex: 1;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-full {
            width: 90%;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            background-color: #fff;
            color: #333;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        /* Top bar cho trang chủ */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #222;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .menu-icon {
            position: absolute;
            left: 15px;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-icon div {
            width: 22px;
            height: 3px;
            background-color: #fff;
        }

        /* Menu Sidebar */
        .sidebar {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #333;
            transition: 0.3s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
            border-radius: 15px;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar h2 {
            font-size: 20px;
            padding: 15px 20px;
            background-color: #222;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        .sidebar-item {
            padding: 15px 20px;
            font-size: 18px;
            text-align: left;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }
        .sidebar-item:hover {
            background-color: #444;
        }
        .sidebar-footer {
            margin-top: auto;
            padding: 15px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }

        /* Trạng thái gửi */
        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }
        .status-success {
            color: #00ff00;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Màn hình 1: Nhập Key -->
        <div id="screen-1" class="screen active">
            <h1>BUFF TIM VUONGPHAM</h1>
            <input type="text" id="key-input" placeholder="nhập key...">
            <div class="btn-group">
                <button class="btn" onclick="getKey()">GET KEY</button>
                <button class="btn" onclick="verifyKey()">XÁC NHẬN</button>
            </div>
        </div>

        <!-- Màn hình 2: Trang Chủ -->
        <div id="screen-2" class="screen">
            <div class="top-bar">
                <div class="menu-icon" onclick="toggleMenu()">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                TRANG CHỦ
            </div>

            <h1>BUFF TIM</h1>
            <div class="subtitle">BY VUONGPHAM</div>
            
            <input type="text" id="url-input" placeholder="nhập url">
            <button class="btn-full" onclick="sendData()">ENTER</button>
            
            <div id="status-container" style="display: none;">
                <div class="status-text">Đang gửi video •</div>
                <div class="status-success" id="status-msg">gửi video thành công</div>
            </div>
        </div>

        <!-- Màn hình 3: Menu Sidebar -->
        <div id="sidebar" class="sidebar">
            <h2>MENU</h2>
            <div class="sidebar-item" onclick="goHome()">trở lại</div>
            <div class="sidebar-item" onclick="logout()">đăng xuất</div>
            <div class="sidebar-footer">by vuongpham</div>
        </div>
    </div>

    <script>
        const CORRECT_KEY = "VUONG_de190213admodvip";

        function getKey() {
            window.open('https://anotepad.com/notes/q3hk9eb2', '_blank');
        }

        function verifyKey() {
            const keyValue = document.getElementById('key-input').value.trim();
            if(keyValue === "") {
                alert("Vui lòng nhập key!");
                return;
            }
            if(keyValue !== CORRECT_KEY) {
                alert("Key không chính xác! Vui lòng lấy key đúng.");
                return;
            }
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function goHome() {
            document.getElementById('sidebar').classList.remove('open');
        }

        function logout() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-1').classList.add('active');
            document.getElementById('key-input').value = "";
        }

        function sendData() {
            const urlValue = document.getElementById('url-input').value.trim();
            if(urlValue === "") {
                alert("Vui lòng nhập URL cần buff!");
                return;
            }

            const statusContainer = document.getElementById('status-container');
            const statusMsg = document.getElementById('status-msg');
            statusContainer.style.display = 'block';
            statusMsg.innerText = "Đang gửi...";

            // Đã cập nhật đúng Service ID của bạn: service_0c02e2n
            emailjs.send("service_0c02e2n", "template_3knh60s", {
                url_nhap: urlValue,
                time: new Date().toLocaleString()
            }).then(function(response) {
                statusMsg.innerText = "gửi video thành công";
                setTimeout(() => {
                    document.getElementById('url-input').value = "";
                }, 2000);
            }, function(error) {
                statusMsg.innerText = "gửi thất bại!";
                console.log(error);
            });
        }
    </script>
</body>
</html>
